[package]
name = "mode7b"
version = "0.1.0"
description = "Mode-7-style procedural road tech demo."
edition = "2021"
rust-version = "1.77"

[lib]
name = "mode7b_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
# Default features kept empty so `cargo check` works without bundling.
default = []
# Enables OS-specific tray/notification stuff if/when we need it.
custom-protocol = ["tauri/custom-protocol"]
